<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — TaskFlow</title>
  <meta name="description" content="Register for TaskFlow to start managing your daily tasks with smart priority focus scores.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
      <button class="theme-toggle-btn" type="button" aria-label="Toggle theme">
        <span>🌙</span> <span>Dark Mode</span>
      </button>
    </div>

    <div class="auth-header">
      <div class="auth-logo">✓</div>
      <h2>Create Your Account</h2>
      <p>Start organizing your tasks and boosting your focus</p>
    </div>

    <form id="register-form">
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="name">Full Name</label>
        <input 
          type="text" 
          id="name" 
          class="form-input" 
          placeholder="Alex Johnson" 
          required 
          autocomplete="name"
        >
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          placeholder="alex@example.com" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label for="password">Password (min. 6 characters)</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="••••••••" 
          required 
          minlength="6"
          autocomplete="new-password"
        >
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label for="confirmPassword">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          class="form-input" 
          placeholder="••••••••" 
          required 
          minlength="6"
          autocomplete="new-password"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
        Create Account
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 0.88rem; color: var(--text-muted);">
      Already have an account? <a href="login.html" style="font-weight: 600;">Sign in</a>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
